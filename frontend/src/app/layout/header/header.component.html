<header style="position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:1px solid var(--unipc-border);font-family:var(--font-sans);" (mouseleave)="closeMega()">

  <a href="#main" style="position:absolute;left:-9999px;top:0;background:var(--unipc-ink);color:var(--unipc-surface);padding:12px 20px;border-radius:0 0 8px 0;z-index:200;" [unipcHover]="'left:0;'">Salta al contenuto</a>

  <div style="background:var(--unipc-ink);color:rgba(255,255,255,.82);font-size:var(--fs-small);">
    <div style="max-width:var(--container-max);margin:0 auto;padding:6px var(--space-section-x);min-height:38px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;">
      <div style="display:flex;align-items:center;gap:clamp(10px,3vw,20px);flex-wrap:wrap;min-width:0;">
       <!-- <a href="#" style="color:var(--unipc-accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:normal;font-size:clamp(.75rem,3.2vw,.8125rem);" [unipcHover]="'color:var(--unipc-surface);'">☎ Numero Verde 800 123 456</a>-->
        <!--<a href="#" style="color:rgba(255,255,255,.82);min-width:0;white-space:normal;" [unipcHover]="'color:var(--unipc-surface);'">✉ info&#64;unipc.it</a>-->
      </div>
      <a href="#" style="color:rgba(255,255,255,.82);font-weight:500;display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:normal;" [unipcHover]="'color:var(--unipc-surface);'">◈ Area riservata</a>
    </div>
  </div>

  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px;transition:height .2s var(--ease);" [style.height]="barHeight">

    <unipc-ui-logo *ngIf="showMark" variant="mark" size="md"></unipc-ui-logo>
    <unipc-ui-logo *ngIf="showFull" variant="full" size="lg"></unipc-ui-logo>

    <ng-container *ngIf="desktop">
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
        <button aria-label="Apri la ricerca" (click)="openSearch()" style="width:44px;height:44px;border:1px solid var(--unipc-border);background:var(--unipc-surface);border-radius:var(--radius-sm);cursor:pointer;font-size:1.05rem;color:var(--unipc-ink);display:grid;place-items:center;transition:all .18s var(--ease);" [unipcHover]="'border-color:var(--unipc-primary);color:var(--unipc-primary);'">⌕</button>
        <a href="#contatti" style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;background:var(--unipc-accent);color:var(--unipc-ink);font-weight:700;font-size:var(--fs-small);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);transition:all .18s var(--ease);white-space:nowrap;" [unipcHover]="'background:var(--unipc-accent-600);transform:translateY(-1px);'">Richiedi info</a>
      </div>
    </ng-container>

    <ng-container *ngIf="!desktop">
      <div style="display:flex;align-items:center;gap:8px;">
        <button aria-label="Apri la ricerca" (click)="openSearch()" style="width:44px;height:44px;border:1px solid var(--unipc-border);background:var(--unipc-surface);border-radius:var(--radius-sm);cursor:pointer;font-size:1.15rem;color:var(--unipc-ink);display:grid;place-items:center;">⌕</button>
        <button aria-label="Apri il menu" [attr.aria-expanded]="mobileOpen" (click)="openMobile()" style="width:44px;height:44px;border:none;background:var(--unipc-ink);color:var(--unipc-surface);border-radius:var(--radius-sm);cursor:pointer;font-size:1.25rem;display:grid;place-items:center;">≡</button>
      </div>
    </ng-container>
  </div>

  <nav *ngIf="desktop" aria-label="Navigazione principale" style="border-top:1px solid var(--unipc-border);background:rgba(255,255,255,.6);">
    <div style="max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:center;gap:2px;min-height:52px;">
      <div *ngFor="let item of nav; let i = index" style="position:relative;" (mouseenter)="setMega(item.mega ? i : null)">
        <a href="#" [attr.aria-haspopup]="!!item.mega" style="display:inline-flex;align-items:center;gap:4px;padding:14px 12px;font-size:var(--fs-small);font-weight:600;letter-spacing:.01em;color:var(--unipc-ink);border-radius:6px;white-space:nowrap;transition:color .15s var(--ease);" [unipcHover]="'color:var(--unipc-primary);'">
          {{ item.label }}<span style="color:var(--unipc-accent);font-size:.6rem;">{{ item.mega ? '▾' : '' }}</span>
        </a>
      </div>
    </div>
  </nav>

  <div *ngIf="megaOpen" role="region" [attr.aria-label]="megaItem?.label" style="position:absolute;left:0;right:0;top:100%;background:var(--unipc-surface);border-bottom:1px solid var(--unipc-border);box-shadow:var(--shadow-lg);animation:unipc-panel-in .2s var(--ease);">
    <div style="max-width:var(--container-max);margin:0 auto;padding:36px var(--space-section-x);display:grid;grid-template-columns:1.4fr 1fr;gap:48px;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px;">
        <div *ngFor="let col of megaItem?.mega?.cols">
          <div style="font-size:.6875rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--unipc-accent);margin-bottom:14px;">{{ col.title }}</div>
          <div style="display:flex;flex-direction:column;gap:2px;">
            <a *ngFor="let link of col.links" href="#" style="display:block;padding:7px 0;font-size:var(--fs-body);font-weight:500;color:var(--unipc-ink);transition:all .15s var(--ease);" [unipcHover]="'color:var(--unipc-primary);padding-left:6px;'">{{ link }}</a>
          </div>
        </div>
      </div>
      <div>
        <div style="font-size:.6875rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--unipc-muted);margin-bottom:14px;">In primo piano</div>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <a *ngFor="let f of megaItem?.mega?.featured" href="#" style="display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--unipc-border);border-radius:var(--radius-md);transition:all .18s var(--ease);" [unipcHover]="'border-color:var(--unipc-primary);box-shadow:var(--shadow-md);transform:translateY(-2px);'">
            <span style="width:72px;height:56px;border-radius:var(--radius-sm);flex-shrink:0;background-image:repeating-linear-gradient(45deg,var(--unipc-placeholder-1),var(--unipc-placeholder-1) 8px,var(--unipc-placeholder-2) 8px,var(--unipc-placeholder-2) 16px);display:grid;place-items:center;font-family:ui-monospace,monospace;font-size:.5rem;color:var(--unipc-muted);">img</span>
            <span>
              <span style="display:block;font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--unipc-accent);">{{ f.cat }}</span>
              <span style="display:block;font-weight:600;font-size:var(--fs-body);color:var(--unipc-ink);margin-top:2px;">{{ f.title }}</span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<div *ngIf="searchOpen" role="dialog" aria-modal="true" aria-label="Ricerca nel sito" style="position:fixed;inset:0;z-index:300;background:rgba(14,27,44,.6);backdrop-filter:blur(8px);animation:unipc-overlay-in .2s var(--ease);" (click)="closeSearch()" (keydown.escape)="closeSearch()">
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div style="max-width:760px;margin:0 auto;padding:clamp(60px,12vh,140px) 20px 0;" (click)="stop($event)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <span style="color:var(--unipc-surface);font-family:var(--font-serif);font-size:1.5rem;">Cerca in UNIPC</span>
      <button aria-label="Chiudi la ricerca" (click)="closeSearch()" style="width:44px;height:44px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--unipc-surface);border-radius:var(--radius-sm);cursor:pointer;font-size:1.25rem;">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;background:var(--unipc-surface);border-radius:var(--radius-md);padding:6px 6px 6px 20px;box-shadow:var(--shadow-lg);">
      <span style="font-size:1.4rem;color:var(--unipc-muted);">⌕</span>
      <input #searchInput type="search" placeholder="Corsi, master, servizi, docenti…" style="flex:1;border:none;outline:none;font-size:1.15rem;font-family:inherit;padding:14px 0;background:transparent;color:var(--unipc-ink);">
      <button style="height:52px;padding:0 26px;background:var(--unipc-accent);color:var(--unipc-ink);border:none;border-radius:var(--radius-sm);font-weight:700;cursor:pointer;">Cerca</button>
    </div>
    <div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      <span style="color:rgba(255,255,255,.65);font-size:var(--fs-small);margin-right:4px;">Ricerche frequenti:</span>
      <a *ngFor="let s of suggestions" href="#" style="padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;color:var(--unipc-surface);font-size:var(--fs-small);" [unipcHover]="'background:rgba(255,255,255,.12);'">{{ s }}</a>
    </div>
  </div>
</div>

<div *ngIf="mobileOpen" role="dialog" aria-modal="true" aria-label="Menu di navigazione" style="position:fixed;inset:0;height:100dvh;z-index:300;background:rgba(14,27,44,.55);animation:unipc-overlay-in .2s var(--ease);" (click)="closeMobile()" (keydown.escape)="closeMobile()">
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div style="position:absolute;top:0;right:0;height:100%;width:min(88vw,380px);background:var(--unipc-surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:unipc-drawer-in .28s var(--ease);" (click)="stop($event)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--unipc-border);flex-shrink:0;">
      <unipc-ui-logo variant="mark" size="sm"></unipc-ui-logo>
      <button aria-label="Chiudi il menu" (click)="closeMobile()" style="width:44px;height:44px;border:1px solid var(--unipc-border);background:transparent;border-radius:var(--radius-sm);cursor:pointer;font-size:1.25rem;color:var(--unipc-ink);">✕</button>
    </div>
    <nav aria-label="Navigazione mobile" style="flex:1;overflow-y:auto;padding:8px 20px;">
      <div *ngFor="let item of nav; let i = index" style="border-bottom:1px solid var(--unipc-border);">
        <button [attr.aria-expanded]="!!mobileExpanded[i]" (click)="toggleMobile(item, i)" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:1rem;font-weight:600;color:var(--unipc-ink);padding:12px 0;text-align:left;">
          {{ item.label }}
          <span *ngIf="item.mega" style="color:var(--unipc-accent);font-size:1.1rem;transition:transform .2s var(--ease);" [style.transform]="rotate(i)">＋</span>
        </button>
        <div *ngIf="mobileExpanded[i]" style="padding:0 0 12px 4px;display:flex;flex-direction:column;gap:2px;">
          <a *ngFor="let link of subLinks(item)" href="#" style="min-height:44px;display:flex;align-items:center;padding:8px 0;font-size:var(--fs-body);color:var(--unipc-muted);" [unipcHover]="'color:var(--unipc-primary);'">{{ link }}</a>
        </div>
      </div>
    </nav>
    <div style="flex-shrink:0;padding:16px 20px;border-top:1px solid var(--unipc-border);background:var(--unipc-surface);">
      <a href="#contatti" (click)="closeMobile()" style="display:flex;align-items:center;justify-content:center;min-height:52px;background:var(--unipc-accent);color:var(--unipc-ink);font-weight:700;border-radius:var(--radius-sm);">Richiedi informazioni</a>
    </div>
  </div>
</div>
